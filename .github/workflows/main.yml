name: Build APK and PWA

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        # android-actions/setup-android@v3 failed at this step in the sampled
        # runs (run 38348434557, job 115135113003: "Set up Android SDK"
        # failure, all downstream steps skipped; the build-pwa job in the
        # same runs succeeded). The ubuntu-latest runner image ships the
        # Android SDK preinstalled; use it directly and install the platform
        # and build-tools this app targets (compileSdk 34).
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          VERSION=$(echo $VERSION | tr -d '\n\r' | xargs)
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Gradle
        run: |
          cd android
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle.zip
          rm gradle.zip

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradle-8.2/bin/gradle
          set +e
          gradle-8.2/bin/gradle assembleDebug --no-daemon --stacktrace > gradle-build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # Loud failure: surface the Gradle tail as a check annotation so
            # the failure reason is readable from the run, not buried in logs.
            python3 -c "import pathlib; t=pathlib.Path('gradle-build.log').read_text(errors='replace'); i=t.find('* What went wrong:'); t=(t[i:i+3200] if i>=0 else t[-3200:]); print('::error::'+t.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A'))"
          fi
          exit $code

      - name: Set APK version
        if: success()
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            mv "$APK_PATH" "android/app/build/outputs/apk/debug/zerok-$VERSION.apk"
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zerok-apk-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/debug/zerok-*.apk
          if-no-files-found: error

  build-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PWA
        run: |
          echo "Validating PWA files..."
          ls -la pwa/

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerok-pwa
          path: pwa/
          if-no-files-found: error